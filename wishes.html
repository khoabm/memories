<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Wishes · Memories</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='90' text-anchor='middle' dominant-baseline='central' dy='.05em'>🎂</text></svg>" />
    <meta name="description" content="Một lời chúc nhỏ, gửi đến bạn." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/wishes.css" />
    <link rel="stylesheet" href="./css/anh-companion.css" />
</head>

<body class="wishes-page">
    <template id="wishes-content-template">

        <!-- Background dùng lại từ style.css -->
        <div class="bg-layer" aria-hidden="true"></div>
        <div class="bg-grain" aria-hidden="true"></div>

        <!-- Hiệu ứng tim / sao bay nhẹ -->
        <div class="floating-layer" id="floatingLayer" aria-hidden="true"></div>

        <!-- Nút quay lại -->
        <a href="./index.html" class="back-link" aria-label="Quay lại">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M19 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Quay lại</span>
        </a>

        <!-- Card chính -->
        <main class="wishes-wrap">
            <article class="wishes-card" aria-label="Lời chúc">

                <!-- Stamp ảnh nhỏ ở góc -->
                <figure class="wishes-stamp" aria-hidden="true">
                    <img src="./assets/images/memories/wishes.jpg" alt="" loading="lazy"
                        onerror="this.style.display='none'" />
                </figure>

                <!-- Tiêu đề thiệp -->
                <header class="wishes-head">
                    <p class="wishes-eyebrow">Best wishes</p>
                    <h1 class="wishes-title">
                        Gửi đến em —<br />
                        <em>người đã và sẽ đồng hành cùng anh</em>
                    </h1>
                </header>

                <!-- Nội dung gõ chữ — 3 đoạn -->
                <div class="wishes-body" id="wishesBody">
                    <!-- Mỗi đoạn có data-text chứa nội dung thật -->
                    <p class="wishes-line" data-text="Một tuổi mới lại đến và mở ra nhiều hướng mới và con đường mới.">
                    </p>
                    <p class="wishes-line"
                        data-text="Cảm ơn em vì đã đi cùng anh qua những ngày tháng ấy — qua cả những lúc vui, và cả những lúc chẳng thể nói gì.">
                    </p>
                    <p class="wishes-line"
                        data-text="Có những điều không thể diễn tả bằng lời - nên mong chút nhỏ nhoi này có thể cho em thấy tình cảm của anh">
                    </p>
                    <p class="wishes-line"
                        data-text="Mong cho những kỉ niệm sẽ cùng ta đồng hành từ bây giờ cho đến mãi mãi về sau nhé">
                    </p>
                    <p class="wishes-line"
                        data-text="Chúc cho em không chỉ một tuổi mới mà còn là một hành trình mới - và có anh trên hành trình đó">
                    </p>
                    <p class="wishes-line"
                        data-text="Chúc em luôn được là chính mình. Và nhớ rằng — em luôn có anh cùng đồng hành bên cạnh.">
                    </p>
                </div>
            </article>
        </main>

        <!-- ANH + AR — independent, freely explorable companion space -->
        <section id="anh-companion" class="anh-companion" aria-labelledby="anh-companion-title">
            <div class="anh-shell">
                <header class="anh-topbar">
                    <a class="anh-brand" href="#anh-companion" aria-label="Anh + AR"><span aria-hidden="true">✧</span>
                        ANH <i>+</i> AR</a>
                    <button class="anh-sound" type="button" data-anh-action="sound" aria-pressed="false">Âm thanh:
                        Tắt</button>
                </header>
                <div class="anh-content"></div>
                <p class="anh-announcement anh-sr-only" role="status" aria-live="polite"></p>
            </div>
        </section>
    </template>

    <script>
        (function () {
            var TARGET_DATE = new Date("2025-10-09T00:00:00+07:00");
            if (Date.now() < TARGET_DATE.getTime()) {
                window.location.replace("./index.html#hero");
                return;
            }
            // Đã đến ngày → clone template vào DOM
            var tpl = document.getElementById("wishes-content-template");
            document.body.appendChild(tpl.content.cloneNode(true));
        })();
    </script>

    <script src="./js/wishes.js"></script>
    <script src="./js/anh-companion.js"></script>
</body>

</html>
